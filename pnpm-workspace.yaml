packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 11 по умолчанию блокирует postinstall-скрипты зависимостей.
# esbuild (внутри tsx) в postinstall распаковывает бинарник под платформу —
# без разрешения tsx не запускается. Каждая новая запись здесь — осознанное решение.
allowBuilds:
  esbuild: true
  # Телеметрия установок, затянутая транзитивно. Функционально не нужна —
  # незачем отправлять наружу факты о сборках этого проекта.
  '@scarf/scarf': false
  # Prisma в postinstall распаковывает движки под платформу — без этого CLI не работает.
  '@prisma/engines': true
  prisma: true
  # SWC компилирует тесты и, в отличие от esbuild, умеет emitDecoratorMetadata —
  # без неё DI в NestJS не работает. В postinstall распаковывает бинарник.
  '@swc/core': true
