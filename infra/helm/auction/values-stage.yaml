# Stage. Домен и владелец репозитория подставляются при первом выкате.

image:
  repository: OWNER/auction

api:
  replicaCount: 1
  env:
    NODE_ENV: production
    LOG_PRETTY: 'false'
    # Один хоп: голый ingress-nginx, Cloudflare ещё не подключён (T-050).
    # Значение зависит от топологии, а не от окружения: появится Cloudflare —
    # станет два, иначе адрес клиента будет браться из подделываемой части
    # X-Forwarded-For.
    TRUST_PROXY_HOPS: '1'

gateway:
  replicaCount: 1
  env:
    NODE_ENV: production
    LOG_PRETTY: 'false'
    TRUST_PROXY_HOPS: '1'

web:
  replicaCount: 1

# Включатся, когда появится apps/workers (T-020, T-027).
workers:
  enabled: false

ingress:
  host: stage.auction.example.kz
  tls:
    enabled: true
    secretName: auction-stage-tls
