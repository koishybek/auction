{{- if .Values.workers.enabled }}
{{/*
Воркеры BullMQ: крон ЕРД 24 ч (T-020), далее finisher дедлайнов торгов,
SLA-возвраты, lockout.

Образ тот же, что у API, — меняется только команда. Воркер живёт в одной
кодовой базе с API (см. CLAUDE.md, раздел 3), и собирать второй образ из тех
же исходников значило бы возить по сети лишние сотни мегабайт ради другого
аргумента запуска.

Сервиса нет намеренно: воркеры ничего не слушают, они разбирают очередь.
Реплик по умолчанию одна: finisher завершает торги, и его горизонтальное
масштабирование требует отдельной защиты от двойного завершения (T-027).
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "auction.fullname" . }}-workers
  labels:
    {{- include "auction.labels" . | nindent 4 }}
    app.kubernetes.io/component: workers
spec:
  replicas: {{ .Values.workers.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: workers
  template:
    metadata:
      labels:
        {{- include "auction.labels" . | nindent 8 }}
        app.kubernetes.io/component: workers
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # Воркер должен успеть дописать текущую задачу, а не бросить её на середине.
      terminationGracePeriodSeconds: 60
      containers:
        - name: workers
          image: {{ include "auction.image" (dict "Values" .Values "Chart" .Chart "component" "api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ['node', 'dist/main.worker.js']
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            {{- range $key, $value := .Values.workers.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          envFrom:
            {{- include "auction.secretEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.workers.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
