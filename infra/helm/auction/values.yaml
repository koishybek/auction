# Значения по умолчанию. Окружения переопределяют их своими файлами
# (values-stage.yaml и далее values-prod.yaml).

nameOverride: ''
image:
  registry: ghcr.io
  # Заполняется владельцем репозитория на первом выкате (T-003).
  repository: OWNER/auction
  tag: '' # пусто → берётся appVersion чарта
  pullPolicy: IfNotPresent
  pullSecrets: []

# Секреты в чарт не кладутся и в git не попадают. Ожидается, что Secret уже
# существует в неймспейсе — его создаёт CI или администратор:
#
#   kubectl create secret generic auction-secrets \
#     --from-literal=DATABASE_URL=... --from-literal=DIRECT_URL=... \
#     --from-literal=REDIS_URL=... \
#     --from-literal=PII_ENCRYPTION_KEY=... --from-literal=PII_BLIND_INDEX_KEY=... \
#     --from-literal=JWT_ACCESS_SECRET=... --from-literal=JWT_REFRESH_SECRET=... \
#     --from-literal=TURNSTILE_SECRET_KEY=...
#
# Все семь обязательны. Схема окружения проверяется на старте, и под с неполным
# секретом не поднимется вовсе — уйдёт в CrashLoopBackOff с перечислением
# недостающего в логе. Раньше здесь были названы пять: по этой команде кластер
# гарантированно не вставал, а выглядело это как поломка образа.
#
# Два ключа ПДн обязаны различаться — это тоже проверяется на старте: утечка
# ключа поиска не должна раскрывать сами персональные данные. TURNSTILE_SECRET_KEY
# в production пустым быть не может: тихий мок капчи на бою — открытая дверь.
secrets:
  existingSecret: auction-secrets

api:
  enabled: true
  replicaCount: 2
  port: 3100
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  env:
    NODE_ENV: production
    LOG_PRETTY: 'false'
    # Сколько прокси стоит перед процессом. За ingress-nginx это как минимум
    # один хоп: под видит TCP-соединение контроллера, а не браузера, и при нуле
    # все участники площадки сливаются в один адрес. Тогда лимит «1 ставка /
    # 500 мс на IP» (FR-10) становится общим на всех, а антинакрутка просмотров
    # (FR-15) перестаёт работать вовсе. Добавится Cloudflare — хопов станет два.
    TRUST_PROXY_HOPS: '1'

web:
  enabled: true
  replicaCount: 2
  port: 3101
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  env:
    NODE_ENV: production

# WebSocket-gateway торгов. Работает из образа API, отличается командой запуска
# (dist/main.gateway.js). Реплик две с самого начала: сокеты должны переживать
# выкат, а мост через Redis pub/sub делает поды равнозначными.
gateway:
  enabled: true
  replicaCount: 2
  port: 3200
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      # Память растёт от числа соединений, а не от нагрузки на CPU: лимит выше,
      # чем у API, при той же скромной заявке.
      memory: 1Gi
  env:
    NODE_ENV: production
    LOG_PRETTY: 'false'
    # Тот же хоп, что у API: gateway тоже стоит за ingress, и на адресе держится
    # лимит ставок по IP.
    TRUST_PROXY_HOPS: '1'

# Фоновые задачи. Работают из образа API, отличаются только командой запуска
# (dist/main.worker.js). Сейчас несут крон перепроверки ЕРД (T-020); дальше
# сюда придут finisher торгов, возвраты задатков и снятие карантина.
workers:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  env:
    NODE_ENV: production
    LOG_PRETTY: 'false'

# Метрики Prometheus (T-053). Порт один на все три процесса: каждый живёт в
# своём поде, и единая цель проще и в конфиге сбора, и в чартах.
#
# В ingress этого порта НЕТ, и это главное: наружу метрики не нужны никому,
# кроме атакующего — размеры комнат, поток ставок и разбивка отказов по кодам
# показывают, где у системы тонко. Собирает их Prometheus внутри кластера.
metrics:
  port: 9464

# Миграции накатываются перед стартом подов, а не приложением на старте:
# иначе две реплики попытаются мигрировать одновременно.
migrations:
  enabled: true
  backoffLimit: 2

ingress:
  enabled: true
  className: nginx
  host: stage.example.kz
  tls:
    enabled: true
    secretName: auction-tls
  # WebSocket-соединения живут десятками минут: дефолтные 60 секунд у NGINX
  # рвали бы торги каждую минуту.
  websocketTimeoutSeconds: 3600

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ['ALL']
