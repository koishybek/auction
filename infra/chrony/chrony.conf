# chrony для нод, на которых крутятся поды аукциона.
#
# Ставится НА ХОСТ, а не в контейнер: у контейнера нет своих часов, он читает
# часы ядра хоста. chrony внутри образа без CAP_SYS_TIME просто ничего не сделает,
# а с ним — начнёт драться с хостовым демоном за одни и те же часы.
#
# Требование NFR-04: расхождение времени между нодами ≤1 мс.

# Пулы. Первым — ближайший к РК, дальше глобальный запас.
pool kz.pool.ntp.org iburst maxsources 4
pool pool.ntp.org iburst maxsources 4

# Для ≤1 мс между нодами опрашиваем источники чаще стандартного.
# minpoll/maxpoll 4..6 = раз в 16–64 секунды.
maxpoll 6
minpoll 4

# Дрейф часов машины, чтобы после рестарта не начинать подстройку с нуля.
driftfile /var/lib/chrony/drift

# Резкий перевод часов разрешён ТОЛЬКО в первые три синхронизации после старта:
# дальше время правится плавным подтягиванием частоты. Скачок часов назад на
# работающей ноде посреди торгов недопустим — по нему считаются дедлайны.
makestep 1.0 3

# Синхронизировать аппаратные часы, чтобы после перезагрузки время не уезжало.
rtcsync

# Логи — они понадобятся при разборе спорного завершения торгов.
logdir /var/log/chrony
log tracking measurements statistics

# Нода — клиент NTP, а не сервер. Раздавать время наружу не нужно.
# (никаких директив allow)
