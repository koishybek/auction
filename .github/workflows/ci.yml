name: CI

on:
  push:
    branches: [main]
  pull_request:

# Новый пуш в ту же ветку отменяет предыдущий прогон: держать очередь
# из устаревших сборок незачем.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  quality:
    name: Линтеры, типы, юнит-тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      # Клиент Prisma нужен typecheck'у: он генерируется в src и участвует в сборке.
      - name: Генерация клиента Prisma
        run: pnpm db:generate

      # Обязательно ДО линтера и типов. @auction/shared резолвится через
      # dist/index.d.ts, и в чистом клоне его нет: правила ESLint, работающие с
      # типами, разом теряют все типы из пакета и валят прогон сотнями ошибок
      # «cannot be resolved». На машине разработчика dist остаётся с прошлых
      # сборок, поэтому локально этого не видно — именно так и вышло.
      #
      # api собирается по той же причине: concurrency-харнесс гонки (load/,
      # T-052) берёт типы из apps/api/dist. Из исходников их взять нельзя —
      # исходники api написаны на декораторах, и харнессу пришлось бы поднимать
      # у себя компилятор NestJS; объявить те же типы у себя нельзя тем более:
      # контракт ставки существует в одном экземпляре.
      - name: Сборка общих пакетов
        run: pnpm --filter @auction/shared --filter @auction/api build

      - name: Проверка форматирования
        run: pnpm format:check

      - name: Линтер
        run: pnpm lint

      - name: Проверка типов
        run: pnpm typecheck

      # Весь воркспейс, а не только api. До T-055 здесь стояло
      # `--filter @auction/api`, и юнит-тесты apps/web не запускались в CI ни
      # разу: клиентская логика ресинка (снимок, тик, заморозка, победитель),
      # поведенческий антибот и виджет задатка проверяются именно там, и их
      # регресс проходил бы мимо CI молча.
      - name: Юнит-тесты
        run: pnpm test

      # Правила Prometheus проверяются здесь, а не на инциденте: алерт, который
      # никто не проверял, — это пожелание, а не защита (T-053). Тем же файлом
      # проверяются формулы дашборда: ошибка в PromQL глазами не видна, панель
      # рисует правдоподобный график и молча врёт.
      - name: Алерты и формулы дашборда
        run: |
          curl -sL "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz" \
            | tar xz --strip-components=1 -C /usr/local/bin "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          cd infra/observability/prometheus
          promtool check rules auction.rules.yml
          promtool test rules auction.rules.test.yml
        env:
          PROMETHEUS_VERSION: 3.13.2

      - name: Сборка
        run: pnpm build

  e2e:
    name: E2E на настоящих PostgreSQL и Redis
    runs-on: ubuntu-latest

    # Сервисные контейнеры дают в CI то, чего нет на dev-машине: настоящий
    # Redis 7. Именно здесь впервые проверяются EVAL, PTTL и pub/sub.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auction
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/auction
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/auction
      REDIS_URL: redis://127.0.0.1:6379
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # Ключи для прогона генерируются здесь, а не лежат литералами в файле.
      #
      # Так они, во-первых, гарантированно нужной длины: первая попытка
      # записать «читаемый» base64 руками дала 31 байт вместо 32, и все двенадцать
      # e2e-сюит легли на валидации окружения. Во-вторых, в репозитории не
      # остаётся строк, похожих на ключи, — их не приходится каждый раз глазами
      # отличать от настоящих. Настоящие живут в секретах окружения.
      - name: Одноразовые ключи прогона
        run: |
          gen32() { node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"; }
          {
            echo "PII_ENCRYPTION_KEY=$(gen32)"
            echo "PII_BLIND_INDEX_KEY=$(gen32)"
            echo "JWT_ACCESS_SECRET=$(gen32)"
            echo "JWT_REFRESH_SECRET=$(gen32)"
          } >> "$GITHUB_ENV"

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      - name: Генерация клиента Prisma
        run: pnpm db:generate

      # Тесты импортируют @auction/shared по dist — в чистом клоне его нет.
      - name: Сборка общих пакетов
        run: pnpm --filter @auction/shared build

      # Проверка окружения гоняется до тестов: если Redis не умеет EVAL или
      # PTTL в миллисекундах, лучше узнать здесь, а не на Phase 3.
      # Файла .env здесь нет — переменные приходят из env job'а выше.
      - name: Проверка окружения
        run: pnpm check:env

      - name: Миграции
        run: pnpm db:deploy

      - name: E2E-тесты
        run: pnpm --filter @auction/api test:e2e

      # Харнессу нужен собранный контейнер приложения: он ставит ставки тем же
      # кодом, что прод, а tsx не умеет emitDecoratorMetadata — без неё DI
      # NestJS не собирается вовсе.
      - name: Сборка API для харнесса гонки
        run: pnpm --filter @auction/api build

      # Гонка ставок в CI — прямая митигация R-4 (двойное принятие или потеря
      # ставки на деньгах). Стоит ПОСЛЕ e2e не случайно: тестовую базу создаёт
      # их global-setup, а харнесс ходит в неё же.
      - name: Гонка ставок, 100 прогонов (QA-02)
        run: pnpm --filter @auction/load race

  browser:
    name: Браузерная приёмка (QA-03/QA-04)
    runs-on: ubuntu-latest

    # Единственное место, где приёмочные сценарии проверяются так, как их
    # увидит участник: обрыв связи во всех статусах, модалка завершения у всех
    # клиентов комнаты, подмена суммы через консоль. До T-055 набор запускался
    # только руками — то есть регресс ресинка не поймал бы никто.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auction
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/auction
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/auction
      REDIS_URL: redis://127.0.0.1:6379
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Одноразовые ключи прогона
        run: |
          gen32() { node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"; }
          {
            echo "PII_ENCRYPTION_KEY=$(gen32)"
            echo "PII_BLIND_INDEX_KEY=$(gen32)"
            echo "JWT_ACCESS_SECRET=$(gen32)"
            echo "JWT_REFRESH_SECRET=$(gen32)"
          } >> "$GITHUB_ENV"

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      - name: Генерация клиента Prisma
        run: pnpm db:generate

      - name: Установка Chromium
        run: pnpm --filter @auction/e2e exec playwright install --with-deps chromium

      # Стенд собирает и поднимает сам набор (e2e/prepare.ts + webServer
      # Playwright): база, миграции, сборка воркспейса, три процесса.
      - name: Приёмка в браузере
        run: pnpm test:browser

      # Следы падений: без них разбор упавшего сценария в CI сводится к
      # угадыванию, а видео и трассировка Playwright уже записаны.
      - name: Следы упавших сценариев
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: e2e/test-results
          retention-days: 7

  images:
    name: Сборка образов
    runs-on: ubuntu-latest
    needs: [quality, e2e, browser]
    permissions:
      contents: read
      packages: write

    strategy:
      # Без fail-fast: падение одного образа отменяло второй, и его результат
      # оставался неизвестным. На отладке сборки это лишний круг ожидания.
      fail-fast: false
      matrix:
        app: [api, web]

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # В registry уходят только сборки с main и теги: образ из чужого PR
      # в общем реестре не нужен, а собрать его для проверки — нужно.
      - name: Вход в registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Метаданные образа
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.app }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Сборка и публикация
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/${{ matrix.app }}.Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    name: Проверка Helm-чарта
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v4

      - name: helm lint
        run: helm lint infra/helm/auction -f infra/helm/auction/values-stage.yaml

      - name: helm template
        run: helm template auction infra/helm/auction -f infra/helm/auction/values-stage.yaml > /dev/null
